<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Save & Load Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>User Notes</h2>

    <!-- The area where the user types their notes -->
    <textarea id="notesArea" placeholder="Write something..."></textarea>

    <br><br>

    <!-- Buttons for saving, loading and clearing notes -->
    <button id="saveBtn">Save Notes</button>
    <button id="loadBtn">Load Notes</button>
    <button id="clearBtn">Clear Notes</button>

    <script src="script.js"></script>
</body>
</html>
