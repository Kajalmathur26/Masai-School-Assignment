<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enhanced Todo List</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Todo List</h2>

    <ul id="taskList"></ul>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
