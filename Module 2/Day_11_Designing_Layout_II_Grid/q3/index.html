<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masai Calculator</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #fafafa;
        }

        h1{
            position: absolute;
            top: 50px;
            font-size: 40px;
            color: #255a58;
            font-weight: 700;
        }

        .container{
            width: 330px;
            padding: 40px 30px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.15);
        }

        .screen{
            width: 100%;
            height: 50px;
            border-radius: 8px;
            background: #f2f2f2;
            margin-bottom: 25px;
            box-shadow: inset 0px 0px 5px rgba(0,0,0,0.1);
        }

        .grid{
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn{
            height: 55px;
            font-size: 22px;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 2px 5px rgba(0,0,0,0.15);
            cursor: pointer;
            user-select: none;
        }

        .op{
            background: #000000;
            color: white;
        }

        .clear{
            background: #e63929;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Masai Calculator</h1>

    <div class="container">

        <div class="screen"></div>

        <div class="grid">
            <div class="btn">1</div>
            <div class="btn">2</div>
            <div class="btn">3</div>
            <div class="btn op">+</div>

            <div class="btn">4</div>
            <div class="btn">5</div>
            <div class="btn">6</div>
            <div class="btn op">-</div>

            <div class="btn">7</div>
            <div class="btn">8</div>
            <div class="btn">9</div>
            <div class="btn op">x</div>

            <div class="btn clear">C</div>
            <div class="btn">0</div>
            <div class="btn op">=</div>
            <div class="btn op">/</div>
        </div>

    </div>

</body>
</html>
