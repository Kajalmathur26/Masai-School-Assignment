<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Layout</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: Arial;
        }

        .grid{
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
            box-sizing: border-box;
        }

        .box{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            color: white;
            font-weight: bold;
        }

        .b2{ background: #ff4500; }
        .b3{ background: #4169e1; }
        .b4{ background: #ffd700; }
        .b5{ background: #9932cc; }
        .b6{ background: #32cd32; }
        .b1{ background: #00bfff; }
        .b7{ background: #ffa07a; }
        .b8{ background: #20b2aa; }
        .b9{ background: #8b0000; }

    </style>
</head>

<body>

    <div class="grid">
        <div class="box b2">2.</div>
        <div class="box b3">3.</div>
        <div class="box b4">4.</div>
        <div class="box b5">5.</div>
        <div class="box b6">6.</div>
        <div class="box b1">1.</div>
        <div class="box b7">7.</div>
        <div class="box b8">8.</div>
        <div class="box b9">9.</div>
    </div>

</body>
</html>
